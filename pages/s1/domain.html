<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题域浏览 · S1 · ADGS Demo</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/pages-s1.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%20y1%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231d4ed8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236d4cff%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2221%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-weight%3D%22700%22%20font-size%3D%2216%22%20fill%3D%22white%22%3EAD%3C%2Ftext%3E%3C%2Fsvg%3E">
</head>
<body>

<script>
  window.BASE = '../../assets/';
  window.SYS = 's1';
  window.PAGE = 'domain';
  window.SIDEBAR = {
    section: '核心功能',
    items: [
      { id: 'catalog',    label: '资产目录',     icon: '📚', href: 'catalog.html' },
      { id: 'dataset',    label: '数据集详情',   icon: '📄', href: 'dataset-detail.html' },
      { id: 'domain',     label: '主题域浏览',   icon: '🗂️', href: 'domain.html' },
      { id: 'standards',  label: '数据标准库',   icon: '📐', href: 'standards.html' },
      { id: 'std-detail', label: '标准详情',     icon: '🏷️', href: 'standard-detail.html' },
      { id: 'change',     label: '变更影响分析', icon: '🔄', href: 'change-impact.html' }
    ]
  };
</script>

<div class="layout">
  <main class="main">

    <div class="breadcrumb">
      <a href="../../index.html">首页</a><span class="sep">/</span>
      <a href="catalog.html">S1 元数据与资产中心</a><span class="sep">/</span>
      <span>主题域浏览</span>
    </div>

    <div class="page-head">
      <h1>主题域浏览</h1>
      <p>按业务域逐层钻取，查看各域下主题、子主题、资产的完整目录树</p>
    </div>

    <div class="split">
      <!-- 左树 -->
      <aside class="tree">
        <div class="group">
          <div class="group-hd"><span class="arr">▾</span>交易域 <span class="ct">312</span></div>
          <div class="child">订单主题 <span class="muted" style="float:right;font-size:11px">128</span></div>
          <div class="child">支付主题 <span class="muted" style="float:right;font-size:11px">86</span></div>
          <div class="child active">退款主题 <span class="muted" style="float:right;font-size:11px">42</span></div>
          <div class="child">结算主题 <span class="muted" style="float:right;font-size:11px">56</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▾</span>用户域 <span class="ct">184</span></div>
          <div class="child">基础属性 <span class="muted" style="float:right;font-size:11px">62</span></div>
          <div class="child">画像标签 <span class="muted" style="float:right;font-size:11px">88</span></div>
          <div class="child">行为序列 <span class="muted" style="float:right;font-size:11px">34</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>商品域 <span class="ct">226</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>日志域 <span class="ct">458</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>营销域 <span class="ct">142</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>风控域 <span class="ct">98</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>智能体域 <span class="ct">76</span></div>
        </div>
        <div class="group">
          <div class="group-hd"><span class="arr">▸</span>供应链域 <span class="ct">124</span></div>
        </div>
      </aside>

      <!-- 右列 -->
      <div>
        <!-- 当前路径概览 -->
        <div class="card mb-4">
          <div class="row" style="justify-content:space-between">
            <div>
              <div style="font-size:12px;color:var(--ink-3)">当前位置</div>
              <h3 style="margin:4px 0 0">交易域 / 退款主题</h3>
              <div class="muted" style="font-size:13px;margin-top:4px">本主题下共 42 张资产 · 已落标 38 · 未落标 4</div>
            </div>
            <div class="row">
              <select class="btn sm"><option>按健康分排序</option><option>按访问量</option></select>
              <button class="btn sm primary">＋ 新建资产</button>
            </div>
          </div>
        </div>

        <!-- 资产列表 -->
        <div class="card">
          <table class="tbl">
            <thead>
              <tr><th>名称</th><th>层级</th><th>Owner</th><th>健康分</th><th>落标</th><th>状态</th><th>访问量</th><th>操作</th></tr>
            </thead>
            <tbody id="listTbl"></tbody>
          </table>
        </div>

      </div>
    </div>

  </main>
</div>

<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/mock.js"></script>
<script src="../../assets/js/render.js"></script>
<script>
  // 模拟当前主题域下的资产（基于 hotAssets 派生）
  const rows = M.hotAssets.concat([
    { id: 'a6', name: 'dwd_trade_refund_di',   tier: 'DWD', owner: '张磊', health: 88, visit: 412, standards: '✅ 已落标' },
    { id: 'a7', name: 'dws_refund_summary_df', tier: 'DWS', owner: '王皓', health: 84, visit: 286, standards: '⚠️ 部分落标' },
    { id: 'a8', name: 'ads_refund_rate_di',    tier: 'ADS', owner: '王皓', health: 90, visit: 198, standards: '✅ 已落标' },
    { id: 'a9', name: 'dim_refund_reason_df',  tier: 'DIM', owner: '赵明', health: 72, visit: 142, standards: '⚠️ 部分落标' }
  ]);
  document.getElementById('listTbl').innerHTML = rows.map(a => `
    <tr>
      <td><a href="dataset-detail.html"><span class="mono">${a.name}</span></a></td>
      <td><span class="badge">${a.tier}</span></td>
      <td>${a.owner}</td>
      <td><span class="badge ${a.health >= 90 ? 'ok' : a.health >= 75 ? 'primary' : 'warn'}">${a.health}</span></td>
      <td><span class="badge ${a.standards.indexOf('已落标') >= 0 ? 'accent' : 'warn'}">${a.standards}</span></td>
      <td><span class="badge ok">已发布</span></td>
      <td>${a.visit}</td>
      <td><a href="dataset-detail.html" class="btn sm">查看</a></td>
    </tr>`).join('');
</script>
</body>
</html>
